<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Graphite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #3f3d4a; font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow: hidden; }
      .splash { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      /* Exact same CSS as the header logo — no changes */
      .element-logo { flex-shrink: 0; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; background: #3f3d4a; border-radius: 4px; width: 58px; height: 58px; text-decoration: none; line-height: 1; padding: 4px 0; gap: 1px; transform: scale(5); transform-origin: center; }
      .el-number { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; color: #e1e1e3; align-self: flex-start; padding-left: 5px; }
      .el-symbol { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: #e1e1e3; display: inline-flex; align-items: baseline; gap: 1px; }
      .el-name { font-size: 7px; font-weight: 700; letter-spacing: 0.18em; color: #e1e1e3; }
    </style>
  </head>
  <body>
    <div class="splash">
      <a class="element-logo" href="/shop">
        <span class="el-number">17</span>
        <span class="el-symbol">G<span style="font-weight:600">r</span></span>
        <span class="el-name">Graphite</span>
      </a>
    </div>
    <script>setTimeout(() => window.location.href = '/shop', 2000);</script>
  </body>
</html>
